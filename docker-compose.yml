version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tmt-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/test_management
      - DATASOURCE_URL=jdbc:postgresql://db:5432/test_management
      - DATASOURCE_USER=postgres
      - DATASOURCE_PASSWORD=SmartQA@Prod2026!SecureDB
      - UPLOAD_DIR=/app/uploads
      - CORS_ALLOWED_ORIGINS=http://10.3.41.102,http://localhost
      - JWT_SECRET=SmartQA$2026!SecureTokenKey@Production#Server102%RandomString789
      - JWT_EXPIRATION=86400000
      - FRONTEND_URL=http://10.3.41.102
      - APP_LOG_LEVEL=INFO
      - SECURITY_LOG_LEVEL=WARN
      - JPA_SHOW_SQL=false
      - MAX_FILE_SIZE=100MB
      - MAX_REQUEST_SIZE=100MB
    volumes:
      - /var/www/html/TestManagementSystem/uploads:/app/uploads
      - /var/www/html/TestManagementSystem/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - tmt-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tmt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - tmt-network

  db:
    image: postgres:15-alpine
    container_name: tmt-db
    environment:
      - POSTGRES_DB=test_management
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SmartQA@Prod2026!SecureDB
    volumes:
      - /var/www/html/TestManagementSystem/data/postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - tmt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_management"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  tmt-network:
    driver: bridge
