<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Bajaj Life Insurance Logo -->
  <defs>
    <linearGradient id="bajajGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2874a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a5276;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3a6e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bajajGrad)" />
  
  <!-- Stylized B infinity/ribbon symbol - Upper loop -->
  <path d="M32 24 C26 17, 16 18, 16 26 C16 32, 24 35, 32 35 C40 35, 48 32, 48 26 C48 20, 40 17, 32 24" 
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Lower swoosh/wave -->
  <path d="M18 33 C20 38, 26 40, 32 40 C40 40, 48 36, 48 42 C48 48, 38 50, 32 47 C26 44, 18 48, 16 48" 
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- LIFE text -->
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">LIFE</text>
</svg>