 Nginx Configuration Block for Test Management System (v2.0)
# Deploy this configuration in your Nginx config directory (e.g., /etc/nginx/sites-available/default)

server {
    listen 80;
    server_name 10.3.41.102; # Replace with your domain if different

    # 1. Serve Frontend SPA under /TestManagementSystem
    location /TestManagementSystem {
        alias /var/www/html/TestManagementSystem;
        index index.html;
        try_files $uri $uri/ /TestManagementSystem/index.html;

        # Enable Gzip Compression for better performance
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    }

    # 2. Proxy API requests to Spring Boot Backend running on Port 8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase upload limit to support Excel imports (configured for 10MB in Spring Boot)
        client_max_body_size 10M;
    }

    # Optional: If you want to run backend and frontend on different ports,
    # or handle files uploads, adjust proxy read timeouts:
    # proxy_read_timeout 300s;
    # proxy_connect_timeout 300s;
}
